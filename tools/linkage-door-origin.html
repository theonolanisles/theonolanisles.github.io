<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linkage synthesis - loading door geometry</title><style>body{font:16px system-ui;margin:3rem;max-width:55rem;color:#21362d}a{color:#245b48}</style></head><body><p id="loading" role="status">Loading the linkage calculator…</p><script>
/* Adapt the guided four-bar calculator to the lower-left door datum, with X and Y positive. */
(async function () {
  const loading = document.getElementById('loading');
  try {
    const response = await fetch('./linkage-revised.html', {cache:'no-store'});
    if (!response.ok) throw Error('The calculator could not be loaded ('+response.status+').');
    let html = await response.text();
    function change(before, after) {
      if (!html.includes(before)) throw Error('Calculator source has changed; the geometry update needs review.');
      html = html.replace(before, after);
    }
    change('return [[-w,-t],[0,-t],[0,0],[-w,0]];',
           'return [[0,0],[w,0],[w,t],[0,t]];');
    change('Closed door: <strong>X = −width to 0</strong>; <strong>Y = −thickness to 0</strong>. Positive Y points up. Consequently O appears at the upper-right edge of this rectangle; locating it at the lower-right would require thickness to extend in +Y.',
           'Closed door: <strong>X = 0 to +width</strong>; <strong>Y = 0 to +thickness</strong>. X points right and Y points up. Door origin O = (0,0) is the <strong>lower-left corner</strong> of the closed door.');
    change('is the right-hand datum, and remains attached to the moving door.',
           'is the lower-left corner of the closed door, and remains attached to the moving door.');
    change("poly(s,[[-w-100,-t-3],[-w-8,-t-3],[-w-8,-t-25],[-w-100,-t-25]],{fill:'#52685b'});", '');
    change("poly(s,[[105,-t-3],[180,-t-3],[180,-t-25],[105,-t-25]],{fill:'#52685b'});", '');
    change('The dark frame is illustrative and is not used as collision geometry.',
           'Only the door and its mechanism are shown; the surrounding structure is not modelled.');
    change('1 · Closed door and fixed frame', '1 · Closed door and origin');
    change('Closed door and frame', 'Closed door and origin');
    change('<option value="cw">Clockwise</option><option value="ccw">Counterclockwise</option>',
           '<option value="ccw">Counterclockwise</option><option value="cw">Clockwise</option>');
    change('In this example the hatch rotates 87.4° clockwise, and O moves 57.6 mm right and 67.8 mm up.',
           'In this example the hatch rotates 87.4° counterclockwise, and O moves 57.6 mm right and 67.8 mm up.');
    change('<div class="nav" role="group" aria-label="Design steps">',
      '<p class="muted">Mechanism: <strong>Four-bar</strong> · <a href="linkage-sixbar.html">Switch to six-bar - same guided interface</a></p><div class="nav" role="group" aria-label="Design steps">');
    html = html.replace('<title>Free hatch linkage calculator | Theodore Nolan-Isles</title>',
      '<title>Free hatch linkage calculator | Theodore Nolan-Isles</title><meta name="description" content="Free four-bar linkage calculator: closed door from X=0 to +width and Y=0 to +thickness; switch to the guided six-bar version.">');
    document.open(); document.write(html); document.close();
  } catch (error) {
    loading.textContent = error.message + ' The earlier calculator remains available below.';
    const link = document.createElement('a'); link.href='./linkage-revised.html'; link.textContent='Open earlier calculator';
    document.body.append(link);
  }
})();
</script></body></html>
